services:
  db:
    image: postgres:16-alpine
    restart: always
    container_name: stream_overlay_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
  backend:
    image: backend_spotify
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    ports:
      - "3000:3000"
  frontend:
    image: frontend_spotify
    build:
      context: ./frontend
    depends_on:
      [backend]
    env_file:
      - ./frontend/.env
    ports:
      - "80:80"

volumes:
  db-data: